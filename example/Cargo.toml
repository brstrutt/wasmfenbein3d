[package]
name = "example"
version = "0.1.7"
edition = "2024"

[dependencies]
wasmfenbein3d = { path = "../core" }
log = "0.4"
wasm-logger = "0.2"
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.122"
web-sys = { version = "0.3.99", features = [
    "console",
    "Window",
    "Document",
    "HtmlElement",
    "Text",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "KeyboardEvent",
    "MouseEvent",
    "Touch",
    "TouchEvent",
    "TouchList",
    "Performance",
    "CssStyleDeclaration",
    "HtmlButtonElement",
    "ImageData",
] }
