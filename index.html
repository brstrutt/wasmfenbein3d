<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>WASMfenBein 3D</title>
  <link data-trunk rel="scss" href="styles.scss" crossorigin="anonymous" />
  <link data-trunk rel="icon" href="assets/icons/favicon.ico" data-integrity="none" />
</head>

<body>
  <canvas id="screen_canvas">
  </canvas>
  <div id="overlay">
    <div id="debug_info">
      <div>
        <div id="fps_display">FPS: ??</div>
        <div id="time_to_render_display">Time to Render: ??ms</div>
      </div>
      <div>
        <div id="resolution_display">Render Resolution: ??x??</div>
      </div>
    </div>
    <div id="HUD">
      <div id="screen_controls">
        <button id="move_left">◄</button>
        <div id="vertical_movement_buttons">
          <button id="move_forward">▲</button>
          <button id="move_backward">▼</button>
        </div>
        <button id="move_right">►</button>
      </div>
    </div>
    <div id="pop_up_page" hidden>Testing</div>
  </div>
</body>

</html>
